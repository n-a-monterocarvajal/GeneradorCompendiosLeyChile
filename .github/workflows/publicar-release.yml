name: Publicar release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Instalar paquete
        run: python -m pip install -e .

      - name: Ejecutar pruebas
        run: python -m unittest discover -s tests -v

      - name: Determinar la versión publicada
        id: version
        run: |
          set -euo pipefail
          version=$(python -c "import generador_compendios_leychile as paquete; print(paquete.__version__)")
          tag="v${version}"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "El tag $GITHUB_REF_NAME no coincide con la versión ${version} del paquete." >&2
            exit 1
          fi
          {
            echo "version=${version}"
            echo "tag=${tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Reunir las notas de la release
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          : > notas.md
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            git tag -l --format='%(contents)' "$TAG" > notas.md
          fi
          if [ ! -s notas.md ] && [ -f "docs/notas-release/${TAG}.md" ]; then
            cp "docs/notas-release/${TAG}.md" notas.md
          fi
          if [ ! -s notas.md ]; then
            echo "Publicación de la versión ${VERSION} del motor de compendios." > notas.md
          fi

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "La release $TAG ya existe; no se reemplaza." >&2
            exit 1
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "GeneradorCompendiosLeyChile ${VERSION}" \
            --notes-file notas.md \
            --latest
