name: Probar revisión desde el navegador (temporal)

on:
  push:
    branches: [claude/project-thread-boc94l]

permissions:
  contents: read

jobs:
  probar:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compendio: [Penal, Ambiental, Tributario]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: n-a-monterocarvajal/Compendio-Derecho-${{ matrix.compendio }}-Chile
          path: compendio
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e . && python -m playwright install --with-deps chromium
      - run: |
          revisar-versiones-leychile --config compendio/app/fuentes.json \
            --estado compendio/.github/estado-versiones.json \
            --cambios cambios.json --resumen resumen.md
          cat resumen.md
